<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name=viewport content="width=device-width,initial-scale=1">
<title>KISAKYE MART GREEN</title>
<style>
body{margin:0;font-family:Arial;background:#f4f9f4;padding-bottom:160px}
.top{background:#0a7a2e;color:#fff;padding:18px;text-align:center;position:sticky;top:0}
.badge{background:#fff;color:#0a7a2e;padding:6px 14px;border-radius:20px;display:inline-block;margin-top:8px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:18px;padding:16px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.price{color:#0a7a2e;font-weight:900;margin:8px 0}
.btn{background:#0a7a2e;color:#fff;border:none;width:100%;padding:12px;border-radius:25px;font-weight:800}
.search{width:92%;margin:12px auto;display:block;padding:14px;border-radius:30px;border:2px solid #a5d6a7}
.cart{position:fixed;bottom:0;left:0;right:0;background:#0a2f14;color:#fff;padding:16px;text-align:center;border-radius:22px 22px 0 0}
.cart button{width:100%;padding:14px;background:#fff;color:#0a7a2e;border:none;border-radius:28px;font-weight:900;margin-top:10px}
</style></head><body>
<div class=top><h2>🌿 KISAKYE MART GREEN</h2><p>FMCG 115 PRODUCTS - UGANDA</p><div class=badge>AIRTEL ONLY 07544590988 *185*9#</div><div style="font-size:11px;margin-top:6px">5% COMMISSION SECURED</div></div>
<input id=q class=search placeholder="Search Kakira Sugar, Omo, Blue Band...">
<div id=list class=grid>Loading fresh products...</div>
<div class=cart><div>🛒 <span id=c>0</span> items | UGX <span id=t>0</span></div><button onclick="checkout()">Checkout WhatsApp → Pay 07544590988</button></div>
<script>
let all=[],cart=[];
async function load(){
 try{let r=await fetch('/api/products');let j=await r.json();all=Array.isArray(j)?j:(j.products||j);if(!all.length)throw ''}catch(e){
  all=[{name:"Kakira Sugar 1kg",price:5500},{name:"Omo 1kg",price:12000},{name:"Blue Band 500g",price:9000},{name:"Bananas",price:2000},{name:"Matooke",price:15000},{name:"Rice 1kg",price:6000},{name:"Cooking Oil 1L",price:8000},{name:"Milk 500ml",price:2500},{name:"Bread",price:4000},{name:"Eggs Tray",price:15000},{name:"Tomatoes 1kg",price:3000},{name:"Avocado",price:1000}]
 }
 document.getElementById('list').innerHTML=all.map((p,i)=>`<div class=card><div style="font-size:30px">🛒</div><b>${p.name}</b><div class=price>UGX ${Number(p.price).toLocaleString()}</div><button class=btn onclick="add(${i})">Add to Cart</button></div>`).join('');
}
function add(i){cart.push(all[i]);document.getElementById('c').innerText=cart.length;document.getElementById('t').innerText=cart.reduce((s,x)=>s+Number(x.price),0).toLocaleString();}
function checkout(){if(!cart.length)return alert('Cart empty!');let tot=cart.reduce((s,x)=>s+Number(x.price),0);let msg=`Hello KISAKYE MART%0A`;cart.forEach(x=>msg+=`- ${x.name} UGX ${x.price}%0A`);msg+=`TOTAL UGX ${tot}%0APay Airtel 07544590988 *185*9#`;fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,total:tot})});window.open('https://wa.me/256754459098?text='+msg);}
document.getElementById('q').addEventListener('input',e=>{let v=e.target.value.toLowerCase();let f=all.filter(p=>p.name.toLowerCase().includes(v));document.getElementById('list').innerHTML=f.map((p)=>`<div class=card><b>${p.name}</b><div class=price>UGX ${p.price}</div><button class=btn onclick="add(${all.indexOf(p)})">Add</button></div>`).join('');});
load();
</script></body></html>
