Id('list').innerHTML=f.length?f.map(p=>`<div class=card><b>${p.name}</b><div class=price>UGX ${p.price}</div><button class=btn onclick="add(${all.indexOf(p)})">Add</button></div>`).join(''):`<div style="grid-column:span 2;text-align:center;padding:30px">No results for "${e.target.value}"</div>`});load();</script></body></html>
