<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kisakye Mart Green</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#f4f9f4;padding-bottom:140px} .top{background:#0a7a2e;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10} .search{width:92%;margin:12px auto;display:block;padding:14px 18px;border-radius:30px;border:2px solid #c8e6c9} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px} .card{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.07)} .price{color:#0a7a2e;font-weight:900;margin:6px 0;font-size:16px} .btn{background:#0a7a2e;color:#fff;border:none;width:100%;padding:11px;border-radius:22px;font-weight:800} .cart{position:fixed;bottom:0;left:0;right:0;background:#0a2f14;color:#fff;padding:14px;border-radius:20px 20px 0 0} .cart button{width:100%;padding:13px;background:#fff;color:#0a7a2e;border:none;border-radius:25px;font-weight:900;margin-top:8px}</style></head><body><div class=top><h2>🌿 KISAKYE MART GREEN</h2><p>Fresh Market • Airtel 07544590988 • *185*9#</p></div><input id=q class=search placeholder="Search Bananas, Matooke..."><div id=list class=grid>Loading...</div><div class=cart><div>🛒 Cart <span id=c>0</span> items | UGX <span id=t>0</span></div><div style=font-size:11px;opacity:.8>Airtel Money ONLY</div><button onclick=checkout()>Checkout via WhatsApp</button></div><script>let all=[],cart=[];async function load(){try{let r=await fetch('/api/products');let d=await r.json();all=Array.isArray(d)?d:d.products||d;}catch(e){all=[{name:'Bananas',price:2000},{name:'Matooke',price:5000}]}show(all)}function show(a){document.getElementById('list').innerHTML=a.map((p,i)=>`<div class=card><div style=font-size:32px>🍌</div><b>${p.name}</b><div class=price>UGX ${p.price}</div><button class=btn onclick=add(${i})>Add to Cart</button></div>`).join('')}function add(i){cart.push(all[i]);document.getElementById('c').innerText=cart.length;let tot=cart.reduce((s,x)=>s+x.price,0);document.getElementById('t').innerText=tot}function checkout(){if(!cart.length)return alert('Cart empty');let tot=cart.reduce((s,x)=>s+x.price,0);let msg=`Hello KISAKYE MART%0A`;cart.forEach(x=>msg+=`- ${x.name} UGX ${x.price}%0A`);msg+=`Total UGX ${tot}%0APay Airtel 07544590988 %2A185%2A9%23`;fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart,total:tot})});window.open('https://wa.me/256754459098?text='+msg)}document.getElementById('q').addEventListener('input',e=>{let v=e.target.value.toLowerCase();show(all.filter(p=>p.name.toLowerCase().includes(v))) });load();</script></body></html>
