<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1"><title>Kisakye Mart Marketplace</title><style>body{margin:0;font-family:sans-serif;background:#f5f5f5}.h{background:#0b7a3e;color:#fff;padding:14px;text-align:center;font-weight:bold;position:sticky;top:0}.pay{background:#fffbe6;border:2px solid #ffcc00;padding:10px;margin:8px;border-radius:10px;text-align:center;font-size:12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.c{background:#fff;border-radius:12px;padding:8px;text-align:center}.c img{width:100%;height:100px;object-fit:contain}.price{color:#0b7a3e;font-weight:bold}.b{background:#0b7a3e;color:#fff;border:0;padding:7px;width:100%;border-radius:20px;font-weight:bold}.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #0b7a3e}</style></head><body>
<div class=h>🛒 KISAKYE MART<br><span style="font-size:11px">Marketplace - Pay on App - 5% stays in App</span></div>
<div class=pay>💳 All transactions made ON THIS APP - App keeps 5% automatically<br><a href="seller-register.html">Seller Register</a> | <a href="admin.html">Admin</a></div>
<div class=g id=g></div><div style=height:90px></div>
<div class=bar><div><b id=ct>Cart 0</b><br><small id=fee>App Fee (5%): UGX 0 stays in App</small></div><button onclick="checkout()" style="background:#25D366;color:#fff;border:0;padding:12px 18px;border-radius:25px;font-weight:bold">Pay on App</button></div>
<script>
let def=[["Sugar 1kg",4000,"https://cdn.pixabay.com/photo/2016/03/05/19/02/sugar-1238243_1280.jpg","Kisakye Mart"],["Rice 1kg",4700,"https://cdn.pixabay.com/photo/2016/03/05/19/02/rice-1238242_1280.jpg","Kisakye Mart"],["Posho 1kg",3000,"https://cdn.pixabay.com/photo/2017/06/02/18/24/corn-2369936_1280.jpg","Kisakye Mart"],["Oil 1L",8200,"https://cdn.pixabay.com/photo/2017/05/07/19/32/oil-2293390_1280.jpg","Kisakye Mart"],["Milk 500ml",2200,"https://cdn.pixabay.com/photo/2017/07/05/18/35/milk-2474993_1280.jpg","Kisakye Mart"],["Bread",3500,"https://cdn.pixabay.com/photo/2016/03/27/19/bread-1264059_1280.jpg","Kisakye Mart"],["Eggs Tray",14500,"https://cdn.pixabay.com/photo/2015/05/07/14/02/eggs-756543_1280.jpg","Kisakye Mart"],["Colgate",4500,"https://cdn.pixabay.com/photo/2017/05/07/19/32/toothpaste-2293394_1280.jpg","Kisakye Mart"]];
let extra=JSON.parse(localStorage.getItem('km_products')||"[]").map(p=>[p.name,p.price,p.img||def[0][2],p.seller]);
let P=[...def,...extra];let C=[];
function draw(){g.innerHTML=P.map((x,i)=>`<div class=c><img src="${x[2]}"><div style="font-size:12px;font-weight:600;min-height:28px">${x[0]}</div><div style="font-size:10px;color:#666">🏪 ${x[3]}</div><div class=price>UGX ${x[1]}</div><button class=b onclick="add(${i})">Add</button></div>`).join('')}
function add(i){C.push({name:P[i][0],price:P[i][1],seller:P[i][3]});let t=C.reduce((a,b)=>a+b.price,0);let f=Math.round(t*0.05);ct.innerText="Cart "+C.length+" | UGX "+t;fee.innerText="App Fee (5%): UGX "+f+" stays in App"}
function checkout(){if(C.length==0){alert("Add products");return}let t=C.reduce((a,b)=>a+b.price,0);let fee=Math.round(t*0.05);let by={};C.forEach(p=>by[p.seller]=(by[p.seller]||0)+p.price);let det=Object.keys(by).map(s=>`SELLER: ${s}\nSale UGX ${by[s]} - App Keeps 5% UGX ${Math.round(by[s]*0.05)} - Seller Gets UGX ${by[s]-Math.round(by[s]*0.05)}`).join('\n---\n');let msg=`MARKETPLACE ORDER - Transaction ON APP\n\n${det}\n\nTOTAL PAID ON APP: UGX ${t}\nAPP PROFIT (5%): UGX ${fee}\nTO SELLERS (95%): UGX ${t-fee}`;window.open("https://wa.me/2567544590988?text="+encodeURIComponent(msg))}
draw();
</script></body></html>
