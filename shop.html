<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Kisakye Mart</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f0f0}
.h{background:#0b7a3e;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:20px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.c{background:#fff;border-radius:10px;padding:10px;text-align:center}
.b{background:#0b7a3e;color:#fff;border:0;padding:8px;width:100%;border-radius:6px;font-weight:bold;margin-top:5px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ccc}
</style>
</head>
<body>
<div class=h>🛒 KISAKYE MART<br><span style="font-size:14px">Fast Delivery</span></div>
<div class=g id=g></div>
<div style=height:70px></div>
<div class=bar><b id=ct>Cart 0</b><button onclick="wa()" style="background:#25D366;color:#fff;border:0;padding:12px 20px;border-radius:20px;font-weight:bold">WhatsApp Order</button></div>
<script>
let P=[["Sugar 1kg",5000],["Oil 1L",8500],["Rice 1kg",4500],["Posho 1kg",3000],["Salt",1500],["Royco",2500],["Blue Band",5500],["Soda",1500],["Water",1000],["Milk 500ml",2500],["Tea 100g",3000],["Nescafe",8000],["Juice 1L",3500],["Soap",6000],["Omo 500g",4000],["Omo 1kg",7500],["Harpic",6000],["Colgate",4500],["Vaseline",5500],["Biscuits",1500],["Bread",4000],["Indomie",1200],["Spaghetti",3500]];
let C=[];
function draw(){document.getElementById('g').innerHTML=P.map((x,i)=>`<div class=c><div style=font-size:40px>🛍️</div><div>${x[0]}</div><div style=color:green;font-weight:bold>UGX ${x[1]}</div><button class=b onclick="add(${i})">Add</button></div>`).join('')}
function add(i){C.push(P[i]);document.getElementById('ct').innerText="Cart "+C.length+" | UGX "+C.reduce((a,b)=>a+b[1],0)}
function wa(){if(C.length==0){alert("Add products first!");return}let t=C.reduce((a,b)=>a+b[1],0);let m="Hello Kisakye Mart! I want:%0A"+C.map(x=>"- "+x[0]+" UGX "+x[1]).join("%0A")+"%0ATotal UGX "+t;window.open("https://wa.me/256700000000?text="+m)}
draw();
</script>
</body>
</html>
