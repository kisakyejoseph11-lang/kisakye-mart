.cartBar{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 10px #0002}
.cartBar button{background:#25D366;color:white;border:none;padding:12px 18px;border-radius:25px;font-weight:bold}

</head>
