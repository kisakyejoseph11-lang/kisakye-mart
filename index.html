<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kisakye Mart FMCG</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

header {
    background: #075e54;
    color: white;
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.search {
    padding: 15px;
    background: white;
}

.search input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.categories {
    display: flex;
    gap: 8px;
    padding: 10px;
    overflow-x: auto;
    background: white;
}

.categories button {
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    background: #eee;
    white-space: nowrap;
}

.products {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(170px, 1fr));
    gap: 15px;
    padding: 15px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.product img {
    width: 100%;
    height: 170px;
    object-fit: contain;
    background: white;
}

.product-info {
    padding: 12px;
}

.product h3 {
    margin: 0 0 7px;
    font-size: 16px;
}

.brand {
    color: #777;
    font-size: 13px;
}

.price {
    color: #075e54;
    font-weight: bold;
    margin: 8px 0;
}

.stock {
    font-size: 12px;
    color: #666;
}

button.buy {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 7px;
    background: #075e54;
    color: white;
    cursor: pointer;
}

.cart {
    position: fixed;
    right: 15px;
    bottom: 15px;
    background: #075e54;
    color: white;
    border-radius: 50px;
    padding: 15px 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.25);
}

</style>
</head>

<body>

<header>
    <h1>KISAKYE MART FMCG</h1>
    <p>Shop FMCG products across Uganda</p>
</header>

<div class="search">
    <input
        type="text"
        id="search"
        placeholder="Search Coca-Cola, soap, milk, noodles..."
    >
</div>

<div class="categories">
    <button onclick="filterCategory('All')">
        All
    </button>

    <button onclick="filterCategory('Food')">
        Food
    </button>

    <button onclick="filterCategory('Drinks')">
        Drinks
    </button>

    <button onclick="filterCategory('Beverages')">
        Beverages
    </button>

    <button onclick="filterCategory('Home Care')">
        Home Care
    </button>

    <button onclick="filterCategory('Personal Care')">
        Personal Care
    </button>
</div>

<div id="products"
     class="products">
</div>

<div class="cart">
    🛒 Cart:
    <span id="cartCount">0</span>
</div>

<script>

let allProducts = [];
let cart = [];

async function loadProducts() {

    try {

        const response =
            await fetch("/api/products");

        allProducts =
            await response.json();

        displayProducts(allProducts);

    } catch (error) {

        document.getElementById("products")
            .innerHTML =
            "<p>Unable to load products.</p>";

        console.error(error);
    }
}

function displayProducts(products) {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    if (!products.length) {

        container.innerHTML =
            "<p>No products found.</p>";

        return;
    }

    products.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <img
                src="${product.image_url}"
                alt="${product.name}"
                onerror="this.src='https://via.placeholder.com/300?text=Product'"
            >

            <div class="product-info">

                <h3>
                    ${product.name}
                </h3>

                <div class="brand">
                    ${product.brand || ""}
                </div>

                <div class="price">
                    UGX
                    ${Number(product.price_ugx)
                        .toLocaleString()}
                </div>

                <div class="stock">
                    Stock:
                    ${product.stock}
                </div>

                <br>

                <button
                    class="buy"
                    onclick="addToCart(${product.id})">

                    Add to Cart

                </button>

            </div>
        `;

        container.appendChild(card);
    });
}

function addToCart(id) {

    const product =
        allProducts.find(p => p.id === id);

    if (!product) return;

    if (product.stock <= 0) {

        alert("This product is out of stock.");

        return;
    }

    cart.push(product);

    document.getElementById("cartCount")
        .textContent = cart.length;

    alert(product.name + " added to cart.");
}

function filterCategory(category) {

    if (category === "All") {

        displayProducts(allProducts);

        return;
    }

    const filtered =
        allProducts.filter(
            p => p.category === category
        );

    displayProducts(filtered);
}

document.getElementById("search")
    .addEventListener("input", function() {

        const value =
            this.value.toLowerCase();

        const filtered =
            allProducts.filter(product =>

                product.name
                    .toLowerCase()
                    .includes(value)

                ||

                (product.brand || "")
                    .toLowerCase()
                    .includes(value)

                ||

                product.category
                    .toLowerCase()
                    .includes(value)
            );

        displayProducts(filtered);
    });

loadProducts();

</script>

</body>
</html>
