<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kisakye Mart - Orders</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding-bottom:90px}.header{background:#008000;color:#fff;padding:14px;text-align:center;position:sticky;top:0}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #008000}.tabs button{flex:1;padding:13px;border:none;background:#fff;font-weight:bold;position:relative}.tabs button.active{background:#008000;color:#fff}.badge{position:absolute;top:2px;right:10px;background:red;color:#fff;border-radius:50%;padding:2px 6px;font-size:11px;display:none}.page{display:none;padding:12px}.page.active{display:block}.prod{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}.prod img{width:75px;height:75px;border-radius:8px;object-fit:cover}.btn{background:#008000;color:#fff;border:none;padding:8px 12px;border-radius:6px;font-weight:bold}.box{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}input{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:7px}.order{background:#e8ffe8;border-left:4px solid #008000;padding:8px;margin:6px 0;border-radius:6px;font-size:14px}</style></head><body>
<div class="header"><h1>🛒 KISAKYE MART</h1><p>📲 Orders → +256744590988</p></div>
<div id="shop" class="page active"><h3>Products 30</h3><div id="list"></div></div>
<div id="seller" class="page"><div class="box"><h3>💰 Seller Dashboard</h3>Sales UGX <b id="sales">0</b> | Profit 5% <b id="profit">0</b><br>Orders: <b id="orderCount">0</b><br><button class="btn" onclick="requestNotify()">🔔 Enable Order Notifications</button><div id="orders"></div></div></div>
<div id="add" class="page"><div class="box"><h3>Add Product</h3><input id="pname" placeholder="Name"><input id="pprice" type="number" placeholder="Price"><button class="btn" onclick="addProd()">Add</button></div></div>
<div id="my" class="page"><div class="box"><h3>My Cart</h3><input id="custName" placeholder="Your Name"><input id="custPhone" placeholder="Your Phone 07..."><div id="cartList">Empty</div><b>Total UGX <span id="cartTotal">0</span></b><br><button class="btn" style="background:#ff6a00;width:100%;margin-top:10px;padding:12px" onclick="checkout()">✅ Order Now - Joseph Gets Notified</button><p style="font-size:12px;margin-top:6px">You will pay via Airtel Money 0744590988 after Joseph confirms on WhatsApp</p></div></div>
<div class="tabs"><button id="t-shop" class="active" onclick="showPage('shop')">SHOP</button><button id="t-seller" onclick="showPage('seller')">SELLER <span id="badge" class="badge">0</span></button><button id="t-add" onclick="showPage('add')">ADD</button><button id="t-my" onclick="showPage('my')">MY (<span id="cartCount">0</span>)</button></div>
<script>
let WA="256744590988";let prods=[{name:"Sugar 1kg",price:5500,img:"https://images.unsplash.com/photo-1587132137056-bfbf0166836e?w=200"},{name:"Posho Flour 1kg",price:3200,img:"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=200"},{name:"Rice 1kg",price:4500,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=200"},{name:"Cooking Oil 1L",price:7500,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=200"},{name:"Beans 1kg",price:4000,img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=200"},{name:"Bread",price:5000,img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=200"},{name:"Milk 500ml",price:2500,img:"https://images.unsplash.com/photo-1550583724-b2692b85b150?w=200"},{name:"Eggs Tray",price:15000,img:"https://images.unsplash.com/photo-1488679831987-9564a7c76c7b?w=200"},{name:"Soda",price:1500,img:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=200"},{name:"Salt",price:1500,img:"https://images.unsplash.com/photo-1518110925495-5fe2fda0442c?w=200"},{name:"Tea Leaves",price:3500,img:"https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=200"},{name:"Blue Band",price:6500,img:"https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=200"},{name:"Royco",price:2000,img:"https://images.unsplash.com/photo-1506368249639-73a05d4f6488?w=200"},{name:"Bar Soap",price:3500,img:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=200"},{name:"Omo",price:4000,img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=200"},{name:"Jik",price:3500,img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=200"},{name:"Toothpaste",price:3000,img:"https://images.unsplash.com/photo-1559671088-5ef93d3b0e5e?w=200"},{name:"Vaseline",price:2500,img:"https://images.unsplash.com/photo-1617897903246-719242758050?w=200"},{name:"Pampers",price:25000,img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=200"},{name:"Biscuits",price:2000,img:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=200"},{name:"Juice",price:3500,img:"https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=200"},{name:"Water",price:1000,img:"https://images.unsplash.com/photo-1559839914-17aae19cec71?w=200"},{name:"Tomatoes",price:3000,img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=200"},{name:"Onions",price:3500,img:"https://images.unsplash.com/photo-1518977956812-cd3dbadaaf31?w=200"},{name:"Irish",price:2500,img:"https://images.unsplash.com/photo-1518977676608-bd36c2ca4f0d?w=200"},{name:"Matooke",price:20000,img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=200"},{name:"Chicken",price:15000,img:"https://images.unsplash.com/photo-1587593810167-a84920ea0781?w=200"},{name:"Beef",price:16000,img:"https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=200"},{name:"Fish",price:14000,img:"https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=200"},{name:"Charcoal",price:35000,img:"https://images.unsplash.com/photo-1507576162314-0d9b247b1dbf?w=200"}];
let cart=JSON.parse(localStorage.getItem('cart_n')||'[]');let sales=+localStorage.getItem('sales_n')||0;let allOrders=JSON.parse(localStorage.getItem('allOrders')||'[]');
function showPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('active'));document.getElementById(p).classList.add('active');document.getElementById('t-'+p).classList.add('active');render();}
function render(){let l=document.getElementById('list');l.innerHTML='';prods.forEach((p,i)=>{l.innerHTML+=`<div class="prod"><img src="${p.img}"><div><b>${p.name}</b><br>UGX ${p.price}<br><button class="btn" onclick="addToCart(${i})">Add to Cart</button></div></div>`});document.getElementById('sales').innerText=sales;document.getElementById('profit').innerText=Math.round(sales*0.05);document.getElementById('orderCount').innerText=allOrders.length;let od=document.getElementById('orders');od.innerHTML='';allOrders.slice().reverse().forEach(o=>{od.innerHTML+=`<div class="order"><b>${o.name}</b> (${o.phone})<br>${o.items.join(', ')}<br>Total UGX ${o.total}<br><small>${o.time}</small></div>`});let b=document.getElementById('badge');if(allOrders.length>0){b.style.display='block';b.innerText=allOrders.length;}renderCart();}
function renderCart(){let cl=document.getElementById('cartList');cl.innerHTML='';let total=0;if(!cart.length)cl.innerHTML='Cart empty';cart.forEach((c,i)=>{total+=c.price;cl.innerHTML+=`${c.name} ${c.price} <button onclick="remCart(${i})">x</button><br>`});document.getElementById('cartTotal').innerText=total;document.getElementById('cartCount').innerText=cart.length;localStorage.setItem('cart_n',JSON.stringify(cart));localStorage.setItem('sales_n',sales);}
function addToCart(i){cart.push(prods[i]);renderCart();showPage('my');}function remCart(i){cart.splice(i,1);renderCart();}
function addProd(){let n=pname.value,pr=+pprice.value;if(!n||!pr)return alert('Enter name price');prods.unshift({name:n,price:pr,img:"https://images.unsplash.com/photo-1542838132-92c53300491e?w=200"});pname.value='';pprice.value='';render();showPage('shop');}
function requestNotify(){if("Notification" in window){Notification.requestPermission().then(p=>{if(p==="granted")new Notification("Kisakye Mart","You will get order notifications now!");});}else alert("Notifications not supported, but WhatsApp will still notify you!");}
function notifyOwner(title,body){if("Notification" in window && Notification.permission==="granted"){new Notification(title,{body:body});}let audio=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");audio.play().catch(()=>{});}
function checkout(){if(!cart.length)return alert('Cart empty');let cname=custName.value||'Customer';let cphone=custPhone.value||'No phone';let t=cart.reduce((a,b)=>a+b.price,0);let order={name:cname,phone:cphone,items:cart.map(c=>c.name),total:t,time:new Date().toLocaleString()};allOrders.push(order);localStorage.setItem('allOrders',JSON.stringify(allOrders));sales+=t;notifyOwner("New Order! UGX "+t, cname+" ordered "+cart.length+" items");render();let msg=`*NEW ORDER - KISAKYE MART*%0AName: ${cname}%0APhone: ${cphone}%0A%0AItems:%0A`+cart.map(c=>`- ${c.name}: UGX ${c.price}`).join('%0A')+`%0A*Total: UGX ${t}*%0A%0APay: Airtel Money 0744590988`;window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');cart=[];custName.value='';custPhone.value='';renderCart();showPage('seller');}
render();
</script></body></html>
