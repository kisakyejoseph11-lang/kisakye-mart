<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kisakye Mart Final</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding-bottom:85px}.header{background:#008000;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #008000}.tabs button{flex:1;padding:14px;border:none;background:#fff;font-weight:bold}.tabs button.active{background:#008000;color:#fff}.page{display:none;padding:10px}.page.active{display:block}.prod{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.1)}.prod img{width:85px;height:85px;border-radius:8px;object-fit:cover;border:1px solid #eee}.btn{background:#008000;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:bold}.box{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}#preview{width:100px;height:100px;border:2px dashed #008000;border-radius:8px;display:none;object-fit:cover}.owner-item{background:#fff;padding:10px;margin:6px 0;border-radius:8px;display:flex;gap:8px;align-items:center;border-left:4px solid #008000}</style></head><body>
<div class="header"><h1>🛒 KISAKYE MART</h1><p>Owner +256744590988 • Green Matooke • Real Stock</p></div>
<div id="shop" class="page active"><h3>Products <span id="count">0</span> - Fresh</h3><div id="list"></div></div>
<div id="seller" class="page"><div class="box"><h3>🔐 Owner Dashboard</h3><div id="ownerLogin"><p style="font-size:13px">Enter PIN to manage products (Delete/Change Photo)</p><input id="ownerPin" type="password" placeholder="PIN = 7445"><button class="btn" onclick="unlockOwner()">Unlock Owner Controls</button></div><div id="ownerControls" style="display:none"><p>Sales UGX <b id="sales">0</b> | Profit <b id="profit">0</b> | Orders <b id="orderCount">0</b></p><h4>Manage Products</h4><div id="manageList"></div><div id="orders"></div><br><button class="btn" style="background:red" onclick="resetShop()">Reset to 30 Default</button> <button class="btn" style="background:#333" onclick="lockOwner()">Lock</button></div></div></div>
<div id="add" class="page"><div class="box"><h3>➕ Add Product with Camera 📸</h3><input id="pname" placeholder="Product Name"><input id="pprice" type="number" placeholder="Price UGX"><input type="file" id="pfile" accept="image/*" capture="environment"><img id="preview"><input id="pimg" placeholder="OR paste image link"><button class="btn" style="width:100%;padding:12px;margin-top:8px" onclick="addProd()">Add Product</button></div></div>
<div id="my" class="page"><div class="box"><h3>My Cart</h3><input id="custName" placeholder="Your Name"><input id="custPhone" placeholder="Phone 07..."><div id="cartList">Empty</div><b>Total UGX <span id="cartTotal">0</span></b><br><button class="btn" style="background:#ff6a00;width:100%;margin-top:10px;padding:12px" onclick="checkout()">Order via WhatsApp 0744590988</button></div></div>
<div class="tabs"><button id="t-shop" class="active" onclick="showPage('shop')">SHOP</button><button id="t-seller" onclick="showPage('seller')">SELLER</button><button id="t-add" onclick="showPage('add')">ADD</button><button id="t-my" onclick="showPage('my')">MY (<span id="cartCount">0</span>)</button></div>
<script>
let WA="256744590988";let OWNER_PIN="7445";
let defaultProds=[
{name:"Sugar 1kg",price:5500,img:"https://images.unsplash.com/photo-1581441363689-1f3d1d6b6a76?w=300"},
{name:"Posho Flour 1kg",price:3200,img:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=300"},
{name:"Rice 1kg",price:4500,img:"https://images.unsplash.com/photo-1536304929831-ee1ca9d44906?w=300"},
{name:"Cooking Oil 1L",price:7500,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=300"},
{name:"Beans 1kg",price:4000,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=300"},
{name:"Bread Loaf",price:5000,img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300"},
{name:"Milk 500ml",price:2500,img:"https://images.unsplash.com/photo-1550583724-b2692b85b150?w=300"},
{name:"Eggs Tray",price:15000,img:"https://images.unsplash.com/photo-1488679831987-9564a7c76c7b?w=300"},
{name:"Soda 500ml",price:1500,img:"https://images.unsplash.com/photo-1624552184280-9e9631bbeee9?w=300"},
{name:"Salt 1kg",price:1500,img:"https://images.unsplash.com/photo-1518110925495-5fe2fda0442c?w=300"},
{name:"Tea Leaves 250g",price:3500,img:"https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=300"},
{name:"Blue Band 250g",price:6500,img:"https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=300"},
{name:"Royco 100g",price:2000,img:"https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=300"},
{name:"Bar Soap",price:3500,img:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=300"},
{name:"Omo 500g",price:4000,img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=300"},
{name:"Jik 500ml",price:3500,img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=300"},
{name:"Toothpaste",price:3000,img:"https://images.unsplash.com/photo-1559671088-5ef93d3b0e5e?w=300"},
{name:"Vaseline",price:2500,img:"https://images.unsplash.com/photo-1617897903246-719242758050?w=300"},
{name:"Pampers",price:25000,img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=300"},
{name:"Biscuits",price:2000,img:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=300"},
{name:"Juice 1L",price:3500,img:"https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=300"},
{name:"Water 1L",price:1000,img:"https://images.unsplash.com/photo-1559839914-17aae19cec71?w=300"},
{name:"Tomatoes 1kg",price:3000,img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=300"},
{name:"Onions 1kg",price:3500,img:"https://images.unsplash.com/photo-1518977956812-cd3dbadaaf31?w=300"},
{name:"Irish Potatoes 1kg",price:2500,img:"https://images.unsplash.com/photo-1518977676608-bd36c2ca4f0d?w=300"},
{name:"Matooke Bunch",price:20000,img:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/Green_bananas.jpg/640px-Green_bananas.jpg"},
{name:"Chicken 1kg",price:15000,img:"https://images.unsplash.com/photo-1587593810167-a84920ea0781?w=300"},
{name:"Beef 1kg",price:16000,img:"https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=300"},
{name:"Fish 1kg",price:14000,img:"https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=300"},
{name:"Charcoal Sack",price:35000,img:"https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=300"}
];
let prods=JSON.parse(localStorage.getItem('kisakye_prods_final')||'null')||defaultProds;let cart=JSON.parse(localStorage.getItem('cart_final')||'[]');let sales=+localStorage.getItem('sales_final')||0;let allOrders=JSON.parse(localStorage.getItem('allOrders_final')||'[]');let selectedImage="";let ownerUnlocked=localStorage.getItem('ownerUnlocked_final')==='yes';
document.getElementById('pfile').addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){selectedImage=ev.target.result;let pv=document.getElementById('preview');pv.src=selectedImage;pv.style.display='block';};r.readAsDataURL(file);});
function saveProds(){localStorage.setItem('kisakye_prods_final',JSON.stringify(prods));}
function showPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('active'));document.getElementById(p).classList.add('active');document.getElementById('t-'+p).classList.add('active');if(p==='seller' && ownerUnlocked){document.getElementById('ownerLogin').style.display='none';document.getElementById('ownerControls').style.display='block';}render();}
function unlockOwner(){if(document.getElementById('ownerPin').value===OWNER_PIN){ownerUnlocked=true;localStorage.setItem('ownerUnlocked_final','yes');document.getElementById('ownerLogin').style.display='none';document.getElementById('ownerControls').style.display='block';render();}else alert('Wrong PIN! Use 7445');}
function lockOwner(){ownerUnlocked=false;localStorage.removeItem('ownerUnlocked_final');document.getElementById('ownerLogin').style.display='block';document.getElementById('ownerControls').style.display='none';}
function render(){let l=document.getElementById('list');l.innerHTML='';prods.forEach((p,i)=>{l.innerHTML+=`<div class="prod"><img src="${p.img}" onerror="this.src='https://via.placeholder.com/80'"><div><b>${p.name}</b><br>UGX ${p.price}<br><button class="btn" onclick="addToCart(${i})">Add to Cart</button></div></div>`});document.getElementById('count').innerText=prods.length;document.getElementById('sales').innerText=sales;document.getElementById('profit').innerText=Math.round(sales*0.05);document.getElementById('orderCount').innerText=allOrders.length;let ml=document.getElementById('manageList');if(ownerUnlocked&&ml){ml.innerHTML='';prods.forEach((p,i)=>{ml.innerHTML+=`<div class="owner-item"><img src="${p.img}" style="width:50px;height:50px;border-radius:6px;object-fit:cover"><div style="flex:1"><b>${p.name}</b><br>UGX ${p.price}</div><div><input type="file" id="change-${i}" accept="image/*" style="display:none" onchange="changePhoto(${i},this)"><button class="btn" style="background:#0066ff;padding:5px 8px;font-size:12px" onclick="document.getElementById('change-${i}').click()">📸</button> <button style="background:red;color:#fff;border:none;padding:5px 8px;border-radius:4px" onclick="deleteProd(${i})">Delete</button></div></div>`});}let od=document.getElementById('orders');if(od){od.innerHTML='';allOrders.slice().reverse().slice(0,10).forEach(o=>{od.innerHTML+=`<div style="background:#e8ffe8;border-left:4px solid green;padding:6px;margin:5px 0;border-radius:5px"><b>${o.name}</b> ${o.phone}<br>${o.items.join(', ')}<br>UGX ${o.total}</div>`});}renderCart();}
function renderCart(){let cl=document.getElementById('cartList');cl.innerHTML='';let total=0;if(!cart.length)cl.innerHTML='Cart empty';cart.forEach((c,i)=>{total+=c.price;cl.innerHTML+=`${c.name} ${c.price} <button onclick="remCart(${i})">x</button><br>`});document.getElementById('cartTotal').innerText=total;document.getElementById('cartCount').innerText=cart.length;localStorage.setItem('cart_final',JSON.stringify(cart));localStorage.setItem('sales_final',sales);localStorage.setItem('allOrders_final',JSON.stringify(allOrders));}
function addToCart(i){cart.push(prods[i]);renderCart();showPage('my');}function remCart(i){cart.splice(i,1);renderCart();}
function addProd(){let n=document.getElementById('pname').value.trim();let pr=+document.getElementById('pprice').value;let link=document.getElementById('pimg').value.trim();let img=selectedImage||link||"https://via.placeholder.com/300";if(!n||!pr)return alert('Enter name and price');prods.unshift({name:n,price:pr,img:img});saveProds();document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pimg').value='';document.getElementById('pfile').value='';document.getElementById('preview').style.display='none';selectedImage='';render();showPage('shop');alert(n+' added!');}
function deleteProd(i){if(confirm('Delete '+prods[i].name+'?')){prods.splice(i,1);saveProds();render();}}
function changePhoto(i,input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){prods[i].img=ev.target.result;saveProds();render();alert('Photo updated!');};r.readAsDataURL(file);}
function resetShop(){if(confirm('Reset to 30 with GREEN matooke?')){prods=[...defaultProds];saveProds();render();}}
function checkout(){if(!cart.length)return alert('Cart empty');let cname=document.getElementById('custName').value||'Customer';let cphone=document.getElementById('custPhone').value||'No phone';let t=cart.reduce((a,b)=>a+b.price,0);let order={name:cname,phone:cphone,items:cart.map(c=>c.name),total:t};allOrders.push(order);sales+=t;render();let msg=`*NEW ORDER KISAKYE MART*%0AName: ${cname}%0APhone: ${cphone}%0AItems:%0A`+cart.map(c=>`- ${c.name} UGX ${c.price}`).join('%0A')+`%0ATotal UGX ${t}`;window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');cart=[];renderCart();showPage('seller');}
if(ownerUnlocked){document.getElementById('ownerLogin').style.display='none';document.getElementById('ownerControls').style.display='block';}
render();
</script></body></html>
